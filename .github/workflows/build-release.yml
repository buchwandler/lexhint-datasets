name: Build Lexhint datasets

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language release to build"
        required: true
        type: choice
        options:
          - ar
          - az
          - bg
          - ca
          - ceb
          - cs
          - de
          - el
          - en
          - es
          - fr
          - ga
          - he
          - hi
          - hu
          - hy
          - id
          - it
          - ja
          - ko
          - ku
          - la
          - lt
          - lv
          - mr
          - ms
          - nl
          - pl
          - pt
          - ro
          - ru
          - sv
          - ta
          - te
          - th
          - tl
          - tr
          - uk
          - ur
          - vi
          - zh
      source_variant:
        description: "Dictionary source variant"
        required: true
        type: choice
        options:
          - native
          - english
      lexhint_ref:
        description: "Lexhint release, branch, or commit"
        required: true
        type: string
        default: "v0.4.7"
      dataset_version:
        description: "Dataset version"
        required: true
        type: string
      source_sha256:
        description: "Optional expected raw source SHA-256"
        required: false
        type: string
        default: ""
      variants:
        description: "Comma-separated dataset variants"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish the verified candidate"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lexhint-datasets-${{ inputs.language }}-${{ inputs.source_variant }}-${{ inputs.dataset_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: buchwandler/lexhint
          ref: ${{ inputs.lexhint_ref }}
          path: _lexhint
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Lexhint 0.4.7 checkout
        run: python -m pip install ./_lexhint
      - name: Resolve configured source variant
        id: source
        env:
          LANGUAGE: ${{ inputs.language }}
          SOURCE_VARIANT: ${{ inputs.source_variant }}
        run: |
          python - <<'PY'
          import os
          from scripts.config import load_config
          source = load_config().source_for(os.environ["LANGUAGE"], os.environ["SOURCE_VARIANT"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"url={source.url}\nlabel={source.label}\n")
              output.write(f"page_url={source.page_url or ''}\nedition={source.wiktionary_edition}\n")
              output.write(f"metadata_language={source.metadata_language}\n")
          PY
      - name: Acquire and hash source
        id: download
        env:
          SOURCE_URL: ${{ steps.source.outputs.url }}
          LANGUAGE: ${{ inputs.language }}
          EXPECTED: ${{ inputs.source_sha256 }}
        run: |
          mkdir -p build/source
          args=(--url "$SOURCE_URL" --output "build/source/$LANGUAGE-raw-wiktextract-data.jsonl.gz" --json)
          [[ -z "$EXPECTED" ]] || args+=(--sha256 "$EXPECTED")
          python -m scripts.download_source "${args[@]}" > build/source/source.json
          python -c 'import json,os; print("sha256=" + json.load(open("build/source/source.json"))["sha256"])' >> "$GITHUB_OUTPUT"
      - name: Verify Lexhint 0.4.7 contract
        run: |
          mkdir -p build
          python -m scripts.verify_lexhint_contract --config datasets.toml --expected-version 0.4.7 --lexhint-commit "$(git -C _lexhint rev-parse HEAD)" --json > build/lexhint-contract.json
      - name: Build source-qualified artifacts
        env:
          LANGUAGE: ${{ inputs.language }}
          SOURCE_VARIANT: ${{ inputs.source_variant }}
          SOURCE_SHA256: ${{ steps.download.outputs.sha256 }}
        run: |
          python -m scripts.build_release \
            --source "build/source/$LANGUAGE-raw-wiktextract-data.jsonl.gz" \
            --build-dir build --language "$LANGUAGE" --source-variant "$SOURCE_VARIANT" \
            --variants "${{ inputs.variants }}" --upstream-sha256 "$SOURCE_SHA256" \
            --lexhint-commit "$(git -C _lexhint rev-parse HEAD)"
      - name: Validate and package candidate
        env:
          LANGUAGE: ${{ inputs.language }}
          SOURCE_VARIANT: ${{ inputs.source_variant }}
          SOURCE_SHA256: ${{ steps.download.outputs.sha256 }}
        run: |
          mkdir -p dist
          IFS=',' read -r -a variants <<< "${{ inputs.variants || 'lexical,runtime,dictionary' }}"
          for variant in "${variants[@]}"; do
            python -m scripts.validate "build/$LANGUAGE-$SOURCE_VARIANT-$variant.sqlite3" --language "$LANGUAGE" --variant "$variant" --expected-source-variant "$SOURCE_VARIANT"
          done
          args=(--build-dir build --output-dir dist --dataset-version "${{ inputs.dataset_version }}" --lexhint-ref "${{ inputs.lexhint_ref }}" --lexhint-commit "$(git -C _lexhint rev-parse HEAD)" --builder-repository "$GITHUB_REPOSITORY" --expected-language "$LANGUAGE" --expected-source-variant "$SOURCE_VARIANT" --source-variant "$SOURCE_VARIANT" --source-url "${{ steps.source.outputs.url }}" --source-label "${{ steps.source.outputs.label }}" --source-page-url "${{ steps.source.outputs.page_url }}" --source-edition "${{ steps.source.outputs.edition }}" --source-metadata-language "${{ steps.source.outputs.metadata_language }}" --source-sha256 "$SOURCE_SHA256" --source-splits "build/source/$SOURCE_VARIANT/source-splits-v1.json" --attribution DATA_SOURCES.md)
          for variant in "${variants[@]}"; do args+=(--expected-variant "$variant"); done
          python -m scripts.package_release "${args[@]}"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: lexhint-datasets-${{ inputs.language }}-${{ inputs.source_variant }}-${{ inputs.dataset_version }}
          path: |
            dist/*.sqlite3.gz
            dist/datasets-v2.json
            dist/SHA256SUMS
            dist/ATTRIBUTION.md
            dist/release-notes.md
            dist/lexhint-contract.json
          if-no-files-found: error
      - name: Publish exact candidate
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-${{ inputs.language }}-${{ inputs.source_variant }}-${{ inputs.dataset_version }}
        run: |
          python scripts/publish_candidate.py dist --dataset-version "${{ inputs.dataset_version }}" --candidate-commit "$GITHUB_SHA" --expected-language "${{ inputs.language }}" --expected-source-variant "${{ inputs.source_variant }}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lexhint ${{ inputs.language }} ${{ inputs.source_variant }} datasets ${{ inputs.dataset_version }}" --notes-file dist/release-notes.md
