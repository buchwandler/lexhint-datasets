name: Build Lexhint datasets

on:
  workflow_dispatch:
    inputs:
      lexhint_ref:
        description: "Lexhint branch, tag, or commit used for the build"
        required: true
        type: string
        default: "main"
      dataset_version:
        description: "Dataset version, for example 2026.08.20"
        required: true
        type: string
      source_url:
        description: "Wiktextract/Kaikki JSONL(.gz) source URL; the default current endpoint is mutable"
        required: false
        type: string
        default: ""
      source_label:
        description: "Human-readable upstream snapshot/source label"
        required: false
        type: string
        default: ""
      source_sha256:
        description: "Optional expected SHA-256. If supplied, downloaded bytes must match; publication records the computed actual digest."
        required: false
        type: string
        default: ""
      languages:
        description: "Comma-separated configured base/build languages; empty uses enabled datasets.toml languages"
        required: false
        type: string
        default: ""
      variants:
        description: "Comma-separated configured dataset variants; empty uses datasets.toml variants"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish the exact verified candidate after construction"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lexhint-datasets-${{ inputs.dataset_version }}
  cancel-in-progress: false

env:
  PYTHON: python

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.config.outputs.languages }}
      variants: ${{ steps.config.outputs.variants }}
      source_url: ${{ steps.config.outputs.source_url }}
      source_label: ${{ steps.config.outputs.source_label }}
    steps:
      - name: Check out dataset repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve configured release selection
        id: config
        env:
          REQUESTED_LANGUAGES: ${{ inputs.languages }}
          REQUESTED_VARIANTS: ${{ inputs.variants }}
          REQUESTED_SOURCE_URL: ${{ inputs.source_url }}
          REQUESTED_SOURCE_LABEL: ${{ inputs.source_label }}
        run: |
          python - <<'PY'
          import os
          from scripts.build_release import resolve_selection
          from scripts.config import load_config

          config = load_config()
          languages, variants = resolve_selection(
              config,
              languages=os.environ["REQUESTED_LANGUAGES"],
              variants=os.environ["REQUESTED_VARIANTS"],
          )
          source_url = os.environ["REQUESTED_SOURCE_URL"] or config.source.url
          source_label = os.environ["REQUESTED_SOURCE_LABEL"] or config.source.label
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"languages={','.join(languages)}\n")
              output.write(f"variants={','.join(variants)}\n")
              output.write(f"source_url={source_url}\n")
              output.write(f"source_label={source_label}\n")
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      source_sha256: ${{ steps.source.outputs.sha256 }}
      schema_version: ${{ steps.contract.outputs.schema_version }}
      lexhint_version: ${{ steps.contract.outputs.lexhint_version }}
    steps:
      - name: Check out dataset repository
        uses: actions/checkout@v6

      - name: Check out Lexhint
        uses: actions/checkout@v6
        with:
          repository: buchwandler/lexhint
          ref: ${{ inputs.lexhint_ref }}
          path: _lexhint
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Lexhint
        run: python -m pip install ./_lexhint

      - name: Verify tagged Lexhint version
        shell: bash
        env:
          LEXHINT_REF: ${{ inputs.lexhint_ref }}
        run: |
          actual="$(python -c 'import lexhint; print(lexhint.__version__)')"
          if [[ -z "$actual" || "$actual" == "0+unknown" ]]; then
            echo "Lexhint version is unresolved: $actual" >&2
            exit 1
          fi
          if [[ "$LEXHINT_REF" == v* ]]; then
            expected="${LEXHINT_REF#v}"
            if [[ "$actual" != "$expected" ]]; then
              echo "Lexhint version mismatch: ref=$LEXHINT_REF expected=$expected actual=$actual" >&2
              exit 1
            fi
          fi

      - name: Record exact Lexhint commit
        shell: bash
        run: |
          echo "LEXHINT_COMMIT=$(git -C _lexhint rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m lexhint --version

      - name: Verify installed Lexhint contract
        id: contract
        shell: bash
        run: |
          mkdir -p build
          python -m scripts.verify_lexhint_contract \
            --config datasets.toml \
            --lexhint-commit "$LEXHINT_COMMIT" \
            --json > build/lexhint-contract.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path("build/lexhint-contract.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"schema_version={contract['schema_version']}\n")
              output.write(f"lexhint_version={contract['lexhint_version']}\n")
          PY
          cat build/lexhint-contract.json

      - name: Acquire and hash dictionary source
        id: source
        env:
          SOURCE_URL: ${{ needs.prepare.outputs.source_url }}
          EXPECTED_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        shell: bash
        run: |
          mkdir -p build/source build/work dist
          args=(
            --url "$SOURCE_URL"
            --output build/source/raw-wiktextract-data.jsonl.gz
            --json
          )
          if [[ -n "$EXPECTED_SOURCE_SHA256" ]]; then
            args+=(--sha256 "$EXPECTED_SOURCE_SHA256")
          fi
          python -m scripts.download_source "${args[@]}" > build/source/source.json
          actual_sha="$(python -c 'import json,sys; print(json.load(sys.stdin)["sha256"])' < build/source/source.json)"
          [[ "$actual_sha" =~ ^[0-9a-f]{64}$ ]] || {
            echo "invalid actual source SHA-256" >&2
            exit 1
          }
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "Acquired source SHA-256: $actual_sha"

      - name: Build configured artifacts from one source split
        env:
          LANGUAGES: ${{ needs.prepare.outputs.languages }}
          VARIANTS: ${{ needs.prepare.outputs.variants }}
          SOURCE: build/source/raw-wiktextract-data.jsonl.gz
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          python -m scripts.build_release \
            --source "$SOURCE" \
            --build-dir build \
            --languages "$LANGUAGES" \
            --variants "$VARIANTS" \
            --upstream-sha256 "$SOURCE_SHA256" \
            --lexhint-commit "$LEXHINT_COMMIT"

      - name: Validate every requested artifact
        env:
          LANGUAGES: ${{ needs.prepare.outputs.languages }}
          VARIANTS: ${{ needs.prepare.outputs.variants }}
          SCHEMA_VERSION: ${{ steps.contract.outputs.schema_version }}
        shell: bash
        run: |
          IFS=',' read -r -a languages <<< "$LANGUAGES"
          IFS=',' read -r -a variants <<< "$VARIANTS"
          for language in "${languages[@]}"; do
            for variant in "${variants[@]}"; do
              python -m scripts.validate "build/${language}-${variant}.sqlite3" \
                --config datasets.toml \
                --language "$language" \
                --variant "$variant" \
                --expected-schema "$SCHEMA_VERSION"
            done
          done

      - name: Assemble and verify immutable candidate
        env:
          DATASET_VERSION: ${{ inputs.dataset_version }}
          LEXHINT_REF: ${{ inputs.lexhint_ref }}
          SOURCE_URL: ${{ needs.prepare.outputs.source_url }}
          SOURCE_LABEL: ${{ needs.prepare.outputs.source_label }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
          LANGUAGES: ${{ needs.prepare.outputs.languages }}
          LEXHINT_VERSION: ${{ steps.contract.outputs.lexhint_version }}
          SCHEMA_VERSION: ${{ steps.contract.outputs.schema_version }}
          VARIANTS: ${{ needs.prepare.outputs.variants }}
        shell: bash
        run: |
          IFS=',' read -r -a languages <<< "$LANGUAGES"
          IFS=',' read -r -a variants <<< "$VARIANTS"
          args=(
            --build-dir build
            --output-dir dist
            --dataset-version "$DATASET_VERSION"
            --lexhint-ref "$LEXHINT_REF"
            --lexhint-version "$LEXHINT_VERSION"
            --lexhint-commit "$LEXHINT_COMMIT"
            --expected-schema "$SCHEMA_VERSION"
            --builder-repository "buchwandler/lexhint-datasets"
            --source-url "$SOURCE_URL"
            --source-label "$SOURCE_LABEL"
            --source-sha256 "$SOURCE_SHA256"
            --source-splits build/source/source-splits-v1.json
            --attribution DATA_SOURCES.md
            --contract build/lexhint-contract.json
          )
          for language in "${languages[@]}"; do args+=(--expected-language "$language"); done
          for variant in "${variants[@]}"; do args+=(--expected-variant "$variant"); done
          if [[ "${{ inputs.publish }}" == "true" ]]; then args+=(--publish); fi
          python -m scripts.package_release "${args[@]}"
          test -s dist/datasets-v2.json
          test -s dist/SHA256SUMS
          test -s dist/ATTRIBUTION.md
          (cd dist && sha256sum -c SHA256SUMS)
          python - <<'PY'
          from pathlib import Path
          limit = 2 * 1024**3
          for path in Path("dist").glob("*.sqlite3.gz"):
              if path.stat().st_size >= limit:
                  raise SystemExit(f"{path} reaches GitHub's 2 GiB asset limit")
          PY
          ls -lh dist/

      - name: Upload exact release candidate
        uses: actions/upload-artifact@v4
        with:
          name: lexhint-datasets-${{ inputs.dataset_version }}
          path: |
            dist/*.sqlite3.gz
            dist/datasets-v2.json
            dist/SHA256SUMS
            dist/ATTRIBUTION.md
            dist/release-notes.md
            dist/lexhint-contract.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@v4
        with:
          name: lexhint-datasets-${{ inputs.dataset_version }}
          path: dist

      - name: Verify candidate before publication
        env:
          LANGUAGES: ${{ needs.prepare.outputs.languages }}
          VARIANTS: ${{ needs.prepare.outputs.variants }}
        shell: bash
        run: |
          test -s dist/datasets-v2.json
          test -s dist/SHA256SUMS
          test -s dist/ATTRIBUTION.md
          (cd dist && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/datasets-v2.json").read_text(encoding="utf-8"))
          languages = set(filter(None, "${{ needs.prepare.outputs.languages }}".split(",")))
          variants = set(filter(None, "${{ needs.prepare.outputs.variants }}".split(",")))
          lexhint = manifest.get("lexhint") or {}
          schema = str(lexhint.get("schema_version", ""))
          if not schema or not lexhint.get("version") or not lexhint.get("commit"):
              raise SystemExit("candidate Lexhint provenance is incomplete")
          actual = set()
          for item in manifest["artifacts"]:
              if item.get("schema_version") != schema:
                  raise SystemExit("candidate artifact schema does not match release schema")
              if f"-s{schema}-" not in item.get("asset", ""):
                  raise SystemExit("candidate filename schema does not match release schema")
              actual.add((item["language"], item["variant"]))
          expected = {(language, variant) for language in languages for variant in variants}
          if actual != expected:
              raise SystemExit(f"candidate matrix mismatch: expected {expected}, got {actual}")
          if not manifest["source"]["sha256"]:
              raise SystemExit("candidate source digest is missing")
          limit = 2 * 1024**3
          for path in Path("dist").glob("*.sqlite3.gz"):
              if path.stat().st_size >= limit:
                  raise SystemExit(f"{path} reaches GitHub's 2 GiB asset limit")
          PY

      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-${{ inputs.dataset_version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Publish exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-${{ inputs.dataset_version }}
        run: |
          gh release create "$TAG" \
            dist/*.sqlite3.gz \
            dist/datasets-v2.json \
            dist/SHA256SUMS \
            dist/ATTRIBUTION.md \
            dist/lexhint-contract.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lexhint datasets ${{ inputs.dataset_version }}" \
            --notes-file dist/release-notes.md
