name: Refresh dataset catalog

on:
  workflow_dispatch:
    inputs:
      release_tags:
        description: "Comma-separated exact source-qualified release tags"
        required: true
        type: string
        default: "data-de-native-2026.08.31"

permissions:
  contents: write

concurrency:
  group: lexhint-datasets-catalog-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Synchronize exact published source-qualified tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ inputs.release_tags }}
        run: |
          cp catalog/datasets-v2.json /tmp/catalog-base.json
          args=()
          IFS=',' read -r -a tags <<< "$RELEASE_TAGS"
          for tag in "${tags[@]}"; do
            tag="${tag//[[:space:]]/}"
            [[ -n "$tag" ]] && args+=(--release-tag "$tag")
          done
          ((${#args[@]} > 0)) || { echo "release_tags must not be empty" >&2; exit 1; }
          python -m scripts.sync_catalog "${args[@]}" --catalog catalog/datasets-v2.json --update
          python -m scripts.verify_catalog --catalog catalog/datasets-v2.json
          python -m scripts.check_catalog_immutability /tmp/catalog-base.json catalog/datasets-v2.json
      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- catalog/datasets-v2.json; then
            echo "Catalog is unchanged."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add catalog/datasets-v2.json
          git commit -m "chore: synchronize source-qualified dataset catalog"
          git push origin HEAD:main
