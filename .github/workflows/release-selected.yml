name: Release selected Lexhint datasets

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated enabled languages to release"
        required: true
        type: string
        default: "de,en,es"
      source_variant:
        description: "Dictionary source variant for every selected language"
        required: true
        type: choice
        options:
          - native
          - english
      lexhint_ref:
        description: "Lexhint release, branch, or commit"
        required: true
        type: string
        default: "v0.4.7"
      dataset_version:
        description: "Dataset version"
        required: true
        type: string
      variants:
        description: "Comma-separated variants"
        required: false
        type: string
        default: "lexical,runtime,dictionary"
      publish:
        description: "Publish verified candidates and refresh catalog v2"
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: write

concurrency:
  group: lexhint-datasets-batch-${{ inputs.source_variant }}-${{ inputs.dataset_version }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: buchwandler/lexhint
          ref: ${{ inputs.lexhint_ref }}
          path: _lexhint
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Lexhint checkout
        run: python -m pip install ./_lexhint
      - name: Resolve source-qualified matrix
        id: selection
        env:
          LANGUAGES: ${{ inputs.languages }}
          SOURCE_VARIANT: ${{ inputs.source_variant }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          python - <<'PY'
          import json, os
          from scripts.build_release import resolve_selection
          from scripts.config import load_config
          config = load_config()
          languages = tuple(item.strip() for item in os.environ["LANGUAGES"].split(",") if item.strip())
          if not languages or len(set(languages)) != len(languages):
              raise SystemExit("languages must be a non-empty list without duplicates")
          for language in languages:
              resolve_selection(config, language=language, source_variant=os.environ["SOURCE_VARIANT"], variants=os.environ.get("VARIANTS"))
          matrix = {"include": [{"language": language, "source_variant": os.environ["SOURCE_VARIANT"]} for language in languages]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          PY

  build-candidates:
    needs: plan
    if: ${{ inputs.publish }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: buchwandler/lexhint
          ref: ${{ inputs.lexhint_ref }}
          path: _lexhint
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ./_lexhint
      - name: Build source-qualified candidate
        env:
          LANGUAGE: ${{ matrix.language }}
          SOURCE_VARIANT: ${{ matrix.source_variant }}
        run: |
          mkdir -p build/source dist
          python - <<'PY'
          import os
          from scripts.config import load_config
          source = load_config().source_for(os.environ["LANGUAGE"], os.environ["SOURCE_VARIANT"])
          with open("build/source/source-config", "w", encoding="utf-8") as output:
              output.write(f"{source.url}\n{source.label}\n{source.page_url or ''}\n{source.wiktionary_edition}\n{source.metadata_language}\n")
          PY
          mapfile -t source < build/source/source-config
          python -m scripts.download_source --url "${source[0]}" --output "build/source/$LANGUAGE-raw-wiktextract-data.jsonl.gz" --json > build/source/source.json
          sha256="$(python -c 'import json; print(json.load(open("build/source/source.json"))["sha256"])')"
          python -m scripts.build_release --source "build/source/$LANGUAGE-raw-wiktextract-data.jsonl.gz" --build-dir build --language "$LANGUAGE" --source-variant "$SOURCE_VARIANT" --variants "${{ inputs.variants }}" --upstream-sha256 "$sha256" --lexhint-commit "$(git -C _lexhint rev-parse HEAD)"
          args=(--build-dir build --output-dir dist --dataset-version "${{ inputs.dataset_version }}" --lexhint-ref "${{ inputs.lexhint_ref }}" --lexhint-commit "$(git -C _lexhint rev-parse HEAD)" --builder-repository "$GITHUB_REPOSITORY" --expected-language "$LANGUAGE" --expected-source-variant "$SOURCE_VARIANT" --source-variant "$SOURCE_VARIANT" --source-url "${source[0]}" --source-label "${source[1]}" --source-page-url "${source[2]}" --source-edition "${source[3]}" --source-metadata-language "${source[4]}" --source-sha256 "$sha256" --source-splits "build/source/$SOURCE_VARIANT/source-splits-v1.json" --attribution DATA_SOURCES.md)
          IFS=',' read -r -a variants <<< "${{ inputs.variants }}"
          for variant in "${variants[@]}"; do args+=(--expected-variant "$variant"); done
          python -m scripts.package_release "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: lexhint-datasets-${{ matrix.language }}-${{ matrix.source_variant }}-${{ inputs.dataset_version }}
          path: dist
          if-no-files-found: error
          compression-level: 0

  publish-all:
    needs: [plan, build-candidates]
    if: ${{ inputs.publish }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: lexhint-datasets-${{ matrix.language }}-${{ matrix.source_variant }}-${{ inputs.dataset_version }}
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify and publish source-qualified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-${{ matrix.language }}-${{ matrix.source_variant }}-${{ inputs.dataset_version }}
        run: |
          python -m scripts.publish_candidate dist --dataset-version "${{ inputs.dataset_version }}" --candidate-commit "${{ github.sha }}" --expected-language "${{ matrix.language }}" --expected-source-variant "${{ matrix.source_variant }}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" --title "Lexhint ${{ matrix.language }} ${{ matrix.source_variant }} datasets ${{ inputs.dataset_version }}" --notes-file dist/release-notes.md

  sync-catalog:
    needs: publish-all
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Synchronize catalog v2 source-qualified tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          IFS=',' read -r -a languages <<< "${{ inputs.languages }}"
          for language in "${languages[@]}"; do args+=(--release-tag "data-$language-${{ inputs.source_variant }}-${{ inputs.dataset_version }}"); done
          python -m scripts.sync_catalog "${args[@]}" --catalog catalog/datasets-v2.json --update
          python -m scripts.verify_catalog catalog/datasets-v2.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/datasets-v2.json
          git diff --cached --quiet || { git commit -m "chore: synchronize source-qualified dataset catalog"; git push origin HEAD:main; }
