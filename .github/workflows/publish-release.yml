name: Publish Lexhint dataset candidate

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language release to publish"
        required: true
        type: choice
        options:
          - ar
          - az
          - bg
          - ca
          - ceb
          - cs
          - de
          - el
          - en
          - es
          - fr
          - ga
          - he
          - hi
          - hu
          - hy
          - id
          - it
          - ja
          - ko
          - ku
          - la
          - lt
          - lv
          - mr
          - ms
          - nl
          - pl
          - pt
          - ro
          - ru
          - sv
          - ta
          - te
          - th
          - tl
          - tr
          - uk
          - ur
          - vi
          - zh
      source_variant:
        description: "Dictionary source variant"
        required: true
        type: choice
        options:
          - native
          - english
      candidate_run_id:
        description: "Build workflow run containing the candidate"
        required: true
        type: string
      candidate_commit:
        description: "Exact builder commit recorded in the candidate"
        required: true
        type: string
      dataset_version:
        description: "Dataset version"
        required: true
        type: string
      variants:
        description: "Comma-separated variants expected in the candidate"
        required: false
        type: string
        default: "lexical,runtime,dictionary"

permissions:
  actions: read
  contents: write

concurrency:
  group: lexhint-datasets-publish-${{ inputs.language }}-${{ inputs.source_variant }}-${{ inputs.dataset_version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download exact source-qualified candidate
        uses: actions/download-artifact@v4
        with:
          name: lexhint-datasets-${{ inputs.language }}-${{ inputs.source_variant }}-${{ inputs.dataset_version }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          path: dist
      - name: Verify candidate source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(dist --dataset-version "${{ inputs.dataset_version }}" --candidate-commit "${{ inputs.candidate_commit }}" --expected-language "${{ inputs.language }}" --expected-source-variant "${{ inputs.source_variant }}")
          IFS=',' read -r -a variants <<< "${{ inputs.variants }}"
          for variant in "${variants[@]}"; do args+=(--expected-variant "$variant"); done
          python scripts/publish_candidate.py "${args[@]}"
      - name: Publish immutable source-qualified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: data-${{ inputs.language }}-${{ inputs.source_variant }}-${{ inputs.dataset_version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "${{ inputs.candidate_commit }}" --title "Lexhint ${{ inputs.language }} ${{ inputs.source_variant }} datasets ${{ inputs.dataset_version }}" --notes-file dist/release-notes.md
