manifest_version = 2
default_variant = "runtime"

[source]
url = "https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz"
label = "Kaikki raw Wiktextract snapshot"
require_sha256_on_publish = true

[variants.lexical]
capabilities = ["lexical"]
recommended = false

[variants.runtime]
profile = "runtime"
capabilities = ["lexical", "semantic"]
recommended = true

[variants.rich]
profile = "rich"
capabilities = ["lexical", "semantic", "dictionary"]
recommended = false

# Physical dataset builds use base language codes only. Runtime locales are Lexhint behavior.
[languages.cs]
enabled = true
[languages.cs.validation]
probe_word = "dům"
# Semantic and dictionary probes are added only after measured candidate evidence.
min_lexemes = 1
min_semantic_rows = 0
min_entries = 0
min_senses = 0
min_frequency_lexemes = 0

[languages.de]
enabled = true
[languages.de.validation]
probe_word = "Haus"
# Semantic and dictionary probes are added only after measured candidate evidence.
