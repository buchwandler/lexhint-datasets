manifest_version = 2
default_variant = "runtime"

[source]
require_sha256_on_publish = true

[release]
default_variants = ["lexical", "runtime", "dictionary"]

[variants.lexical]
capabilities = ["lexical"]
recommended = false

[variants.runtime]
profile = "runtime"
capabilities = ["lexical", "semantic"]
recommended = true

[variants.dictionary]
capabilities = ["lexical", "semantic", "dictionary"]
recommended = false

[variants.rich]
profile = "rich"
capabilities = ["lexical", "semantic", "dictionary", "search"]
recommended = false

