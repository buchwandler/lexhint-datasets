manifest_version = 2
default_variant = "runtime"

[source]
require_sha256_on_publish = true
[release]
default_variants = ["lexical", "runtime", "dictionary"]

[variants.lexical]
capabilities = ["lexical"]
recommended = false

[variants.runtime]
profile = "runtime"
capabilities = ["lexical", "semantic"]
recommended = true

[variants.dictionary]
capabilities = ["lexical", "semantic", "dictionary"]
recommended = false

[variants.rich]
profile = "rich"
capabilities = ["lexical", "semantic", "dictionary", "search"]
recommended = false
# Physical dataset builds use base language codes only. Runtime locales are Lexhint behavior.
[languages.cs]
enabled = true
[languages.cs.source]
edition = "cswiktionary"
url = "https://kaikki.org/cswiktionary/raw-wiktextract-data.jsonl.gz"
label = "Kaikki raw Wiktextract from Czech Wiktionary edition"
page_url = "https://kaikki.org/cswiktionary/rawdata.html"
[languages.cs.validation]
probe_word = "dům"
# Semantic and dictionary probes are added only after measured candidate evidence.
min_lexemes = 1
min_semantic_rows = 0
min_entries = 0
min_senses = 0
min_relations = 0
min_frequency_lexemes = 0

